name: Reusable ECS Deploy

on:
  workflow_call:
    inputs:
      environment_name:
        description: Target GitHub environment
        required: true
        type: string

      image_uri:
        description: Immutable container image URI to deploy
        required: true
        type: string

      build_tag:
        description: Build or release identifier
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment_name }}
    runs-on: ubuntu-24.04

    environment:
      name: ${{ inputs.environment_name }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials for deployment
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Export current ECS task definition
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
          ECS_SERVICE_NAME: ${{ vars.ECS_SERVICE_NAME }}
        run: |
          set -euo pipefail

          CURRENT_TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "${ECS_CLUSTER_NAME}" \
            --services "${ECS_SERVICE_NAME}" \
            --region "${AWS_REGION}" \
            --query "services[0].taskDefinition" \
            --output text)

          echo "Current task definition: ${CURRENT_TASK_DEF_ARN}"

          aws ecs describe-task-definition \
            --task-definition "${CURRENT_TASK_DEF_ARN}" \
            --region "${AWS_REGION}" \
            --query "taskDefinition" \
            --output json > task-definition-full.json

          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' task-definition-full.json > task-definition.json

      - name: Render ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@c804dfbdd57f713b6c079302a4c01db7017a36fc
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ inputs.image_uri }}
          environment-variables: |
            BUILD_TAG=${{ inputs.build_tag }}

      - name: Deploy to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@df9643053eda01f169e64a0e60233aacca83799a
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE_NAME }}
          cluster: ${{ vars.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true

      - name: Smoke test service
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: |
          set -euo pipefail

          APP_BASE_URL="${APP_BASE_URL%/}"

          echo "Testing /health"
          curl -fsS "${APP_BASE_URL}/health"

          echo "Testing /db-health"
          curl -fsS "${APP_BASE_URL}/db-health"

      - name: Print ECS diagnostics on failure
        if: failure()
        env:
          ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
          ECS_SERVICE_NAME: ${{ vars.ECS_SERVICE_NAME }}
        run: |
          aws ecs describe-services \
            --cluster "${ECS_CLUSTER_NAME}" \
            --services "${ECS_SERVICE_NAME}" \
            --query "services[0].{
              status:status,
              desired:desiredCount,
              running:runningCount,
              pending:pendingCount,
              taskDefinition:taskDefinition,
              events:events[0:10]
            }" \
            --output table
