name: CD

on:
  push:
    branches:
      - dev

  pull_request:
    types:
      - closed
    branches:
      - qa
      - prod

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  # ============================================================
  # DEV: BUILD ONCE
  # ============================================================

  build-scan-push:
    name: Build, scan and push image
    if: github.event_name == 'push' && github.ref_name == 'dev'
    runs-on: ubuntu-24.04

    environment: dev

    permissions:
      id-token: write
      contents: read

    outputs:
      image_uri: ${{ steps.push-image.outputs.image_uri }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials for build
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37
        with:
          role-to-assume: ${{ secrets.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build app image for linux/amd64
        run: |
          docker buildx build \
            --pull \
            --platform linux/amd64 \
            --load \
            -t week6-devops-prac:${{ github.sha }} \
            .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: image
          image-ref: week6-devops-prac:${{ github.sha }}
          format: table
          exit-code: "1"
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Login to ECR
        run: |
          set -euo pipefail

          ECR_REPOSITORY_URL="$(printf '%s' '${{ vars.ECR_REPOSITORY_URL }}' | tr -d '\r\n' | xargs)"
          ECR_REGISTRY="${ECR_REPOSITORY_URL%%/*}"

          aws ecr get-login-password \
            --region "${{ vars.AWS_REGION }}" \
            | docker login \
                --username AWS \
                --password-stdin "${ECR_REGISTRY}"

      - name: Push image to ECR
        id: push-image
        run: |
          set -euo pipefail

          IMAGE_TAG="${{ github.sha }}"
          ECR_REPOSITORY_URL="$(printf '%s' '${{ vars.ECR_REPOSITORY_URL }}' | tr -d '\r\n' | xargs)"
          IMAGE_URI="${ECR_REPOSITORY_URL}:${IMAGE_TAG}"

          echo "Pushing image: ${IMAGE_URI}"

          docker tag \
            "week6-devops-prac:${IMAGE_TAG}" \
            "${IMAGE_URI}"

          docker push "${IMAGE_URI}"

          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

  # ============================================================
  # DEV: DEPLOY
  # ============================================================

  deploy-dev:
    name: Deploy image to DEV
    if: github.event_name == 'push' && github.ref_name == 'dev'
    permissions:
      id-token: write
      contents: read

    needs: build-scan-push

    uses: ./.github/workflows/reusable-ecs-deploy.yml

    with:
      environment_name: dev
      image_uri: ${{ needs.build-scan-push.outputs.image_uri }}
      build_tag: ${{ github.sha }}

  # ============================================================
  # QA / PROD: PROMOTE EXISTING ARTIFACT
  # ============================================================
  promote-image:
    name: Promote existing image

    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.head_ref == 'dev' && github.base_ref == 'qa') ||
        (github.head_ref == 'qa' && github.base_ref == 'prod')
      )

    runs-on: ubuntu-24.04

    permissions:
      id-token: write
      contents: read

    outputs:
      image_uri: ${{ steps.promote.outputs.image_uri }}
      artifact_digest: ${{ steps.promote.outputs.artifact_digest }}
      target_sha: ${{ steps.promotion.outputs.target_sha }}
      target_environment: ${{ steps.promotion.outputs.target_branch }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configure AWS credentials for artifact promotion
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37
        with:
          role-to-assume: ${{ vars.AWS_PROMOTION_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve promotion metadata
        id: promotion
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          TARGET_BRANCH: ${{ github.base_ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "source_branch=${SOURCE_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "target_branch=${TARGET_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "target_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"

          echo "Promoting ${SOURCE_BRANCH} -> ${TARGET_BRANCH}"
          echo "Source SHA: ${SOURCE_SHA}"
          echo "Target SHA: ${TARGET_SHA}"

      - name: Promote ECR artifact
        id: promote
        uses: ./.github/actions/promote-ecr-image
        with:
          ecr_repository_url: ${{ vars.ECR_REPOSITORY_URL }}
          source_sha: ${{ steps.promotion.outputs.source_sha }}
          target_sha: ${{ steps.promotion.outputs.target_sha }}
  # ============================================================
  # QA / PROD: DEPLOY PROMOTED ARTIFACT
  # ============================================================

  deploy-promoted:
    name: Deploy promoted image

    needs:
      - promote-image

    permissions:
      id-token: write
      contents: read

    uses: ./.github/workflows/reusable-ecs-deploy.yml

    with:
      environment_name: ${{ needs.promote-image.outputs.target_environment }}
      image_uri: ${{ needs.promote-image.outputs.image_uri }}
      build_tag: ${{ needs.promote-image.outputs.target_sha }}
