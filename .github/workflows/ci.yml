name: CI-CD

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - dev
      - qa

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    name: CI quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Lint Dockerfile with Hadolint
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/workspace \
            -w /workspace \
            hadolint/hadolint hadolint Dockerfile

  build-scan-push:
    name: Build, scan and push image
    runs-on: ubuntu-latest
    needs: ci

    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'qa' || github.ref_name == 'prod')

    environment: ${{ github.ref_name }}

    permissions:
      id-token: write
      contents: read

    outputs:
      image_uri: ${{ steps.push-image.outputs.image_uri }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37
        with:
          role-to-assume: ${{ secrets.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build app image for linux/amd64
        run: |
          docker buildx build \
            --pull \
            --platform linux/amd64 \
            --load \
            -t week6-devops-prac:${{ github.sha }} \
            .
      - name: Run Trivy vulnerability scan before push
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: image
          image-ref: week6-devops-prac:${{ github.sha }}
          format: table
          exit-code: "1"
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Login to ECR
        run: |
          ECR_REGISTRY="${{ vars.ECR_REPOSITORY_URL }}"
          ECR_REGISTRY="${ECR_REGISTRY%%/*}"

          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

      - name: Push image to ECR
        id: push-image
        run: |
          IMAGE_TAG="${{ github.sha }}"
          IMAGE_URI="${{ vars.ECR_REPOSITORY_URL }}:${IMAGE_TAG}"

          docker tag "week6-devops-prac:${IMAGE_TAG}" "${IMAGE_URI}"
          docker push "${IMAGE_URI}"

          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
